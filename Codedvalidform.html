<html>
    <head>
        <link rel="stylesheet" href="portfolio02style.css">
        <script>
            function validateForm()
            {
                var firstname = document.forms["form1"]["fname"].value;
                var lastname = document.forms["form1"]["lname"].value;
                var password1 = document.forms["form1"]["password1"].value;
                var password2 = document.forms["form1"]["password2"].value;
                var email = document.forms["form1"]["email"].value;

                if(firstname==null || firstname==""){

                    alert("Name is empty");
                    return false;
                }

                if(lastname==null || lastname==""){

                    alert("Lastname is empty");
                    return false;
                }

                if(password1==null || password1==""){

                    alert("password is empty");
                    return false;
                }

                if(password2==null || password2==""){

                    alert("password is empty");
                    return false;
                }

                //do password match
                if(password1!=password2 && password1=="")
                {
                    alert("passwords do not match")
                }

                var foundAt = 0;
                var foundDot = 0;

                if(email.length>2){
                    for(i=0;i<email.length;i++){

                        if(email[i]=='@'){foundAt = i;}
                        if(email[i]=='.'){foundDot = i;}


                    }
                    if(foundAt>1 && foundDot > foundAt + 3 && foundDot < email.length-2){
                        return true;
                    }
                    
                }
                else{
                    alert("Email invalid");
                    return false;
                }


                return false;
            }
        </script>
    </head>
<body>
<div class="formpage">
    <form name="form1" action="Correctans.html" onsubmit="return validateForm()">
        <label for="fname">First Name</label>
        <input type="text" id="fname" name="firstname" placeholder="Your name...">

        <label for="lname">Last Name</label>
        <input type="text" id="lname" name="lname" placeholder="Your last name...">

        <label for="password">Password</label>
        <input type="password" id="password1" name="password" placeholder="Your pass">
        <br>

        <label for="rpassword">repeat Password</label>
        <input type="password" id="password2" name="rpassword" placeholder="Your pass">
        <br>

        <label for="email">Email</label>
        <input type="text" id="email" name="email" placeholder="Your email">

        <label for="purpose">Purpose</label>
        <select id="purpose" name="purpose">
            <option value="Business">Business</option>
            <option value="Pleasure">Pleasure</option>
            <option value="Both">Both</option>
        </select>

        <label for="query">Query</label>
        <p>
            <textarea id="query" name="query" rows="4" cols="60">
            </textarea>
        </p>

        <input type="submit" value="Submit">

    </form>
</div>

</body>
</html>
