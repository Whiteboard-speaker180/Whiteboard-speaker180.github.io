<html>
    <head>
        <link rel="stylesheet" href="portfolio02style.css">

    </head>
<body>
<div class="formpage">
    <form name="form1" action="Correctans.html">
        <label for="fname">First Name</label>
        <input type="text" id="fname" name="firstname" placeholder="Your name..." required>

        <label for="lname">Last Name</label>
        <input type="text" id="lname" name="lname" placeholder="Your last name..." required>

        <label for="password">Password</label>
        <input type="password" id="password1" name="password" placeholder="Your pass" required>
        <br>

        <label for="rpassword">repeat Password</label>
        <input type="password" id="password2" name="rpassword" placeholder="Your pass" required>
        <br>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Your email" required>

        <label for="purpose">Purpose</label>
        <select id="purpose" name="purpose">
            <option value="Business">Business</option>
            <option value="Pleasure">Pleasure</option>
            <option value="Both">Both</option>
        </select>

        <label for="query">Query</label>
        <p>
            <textarea id="query" name="query" rows="4" cols="60">
            </textarea>
        </p>

        <input type="submit" value="Submit">

    </form>
</div>

</body>
</html>
